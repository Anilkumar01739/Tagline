[package]
name = "tagline-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the TagLine engine."

# `tagline` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "tagline-cli"
path = "src/main.rs"

[dependencies]
tagline-core.workspace = true
tagline-media.workspace = true
tagline-render.workspace = true
# The `api` command: the TagLine API over stdin and stdout. The `serve`
# command: the same on a socket.
tagline-api.workspace = true
tagline-server.workspace = true
serde_json.workspace = true
# `preview` draws one effect's card, as the window does; `check` loads
# packages and runs their probes.
tagline-effects.workspace = true
tagline-host.workspace = true
clap.workspace = true

[features]
# `serve --grpc`. Off by default; see tagline-server.
grpc = ["tagline-server/grpc"]

[lints]
workspace = true
