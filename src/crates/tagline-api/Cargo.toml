[package]
name = "tagline-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The TagLine API: one dispatcher for projects, edits, media, effects, templates, exports and frames, which every transport - the command line, a daemon, a plugin - calls."

[dependencies]
tagline-core.workspace = true
tagline-project.workspace = true
tagline-effects.workspace = true
tagline-export.workspace = true
tagline-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The frame method hands back a PNG: the one picture format every
# caller reads and that keeps the compositor's pixels exact.
png = "0.18"
# A frame handed back inline crosses as text.
base64 = "0.23"
schemars = { workspace = true, optional = true }

[features]
# A JSON Schema for every request, generated from the types and their doc
# comments: what tagline-mcp gives an agent for each tool's arguments.
schema = ["dep:schemars", "tagline-project/schema", "tagline-host/schema"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
