name: Android APK

# Same Android build path as .github/workflows/mobile.yml (arm64 ship APK),
# without x86_64, emulator smoke, or iOS.
# Public-repo run: start after Actions billing unblock.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build arm64 APK (mobile.yml)
    permissions:
      contents: read
    uses: ./.github/workflows/mobile.yml
    with:
      android_only: true
    secrets: inherit
